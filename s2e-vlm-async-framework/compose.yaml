name: s2e-vlm-async-framework

x-ros-env: &ros-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
  S2E_SENSOR_CONFIG_DIR: ${S2E_SENSOR_CONFIG_DIR:-}
  S2E_DEBUG_MODE: ${S2E_DEBUG_MODE:-0}

x-mock-runtime-env: &mock-runtime-env
  S2E_MOCK_LIDAR_PERIOD_S: ${S2E_MOCK_LIDAR_PERIOD_S:-0.2}
  S2E_MOCK_CAMERA_WIDTH: ${S2E_MOCK_CAMERA_WIDTH:-640}
  S2E_MOCK_CAMERA_HEIGHT: ${S2E_MOCK_CAMERA_HEIGHT:-480}
  S2E_MOCK_CAMERA_MODE: ${S2E_MOCK_CAMERA_MODE:-white}
  S2E_MOCK_CAMERA_PERIOD_S: ${S2E_MOCK_CAMERA_PERIOD_S:-0.1}
  S2E_MOCK_IMU_PERIOD_S: ${S2E_MOCK_IMU_PERIOD_S:-0.01}
  S2E_MOCK_ODOMETRY_PERIOD_S: ${S2E_MOCK_ODOMETRY_PERIOD_S:-0.02}
  S2E_MOCK_VLM_SCENARIOS: ${S2E_MOCK_VLM_SCENARIOS:-go}
  S2E_MOCK_VLM_PERIOD_S: ${S2E_MOCK_VLM_PERIOD_S:-2.0}
  S2E_MOCK_GROUND_Z_M: ${S2E_MOCK_GROUND_Z_M:-0.0}
  S2E_MOCK_MAX_GOAL_DISTANCE_M: ${S2E_MOCK_MAX_GOAL_DISTANCE_M:-8.0}
  S2E_MOCK_E2E_PERIOD_S: ${S2E_MOCK_E2E_PERIOD_S:-0.2}
  S2E_MOCK_VLM_TTL_S: ${S2E_MOCK_VLM_TTL_S:-8.0}
  S2E_MOCK_CONTROLLER_PERIOD_S: ${S2E_MOCK_CONTROLLER_PERIOD_S:-0.05}
  S2E_MOCK_TRAJECTORY_TTL_S: ${S2E_MOCK_TRAJECTORY_TTL_S:-1.0}
  S2E_MOCK_SUPERVISOR_PERIOD_S: ${S2E_MOCK_SUPERVISOR_PERIOD_S:-0.2}
  S2E_MOCK_HEARTBEAT_TIMEOUT_S: ${S2E_MOCK_HEARTBEAT_TIMEOUT_S:-3.0}
  S2E_MOCK_ARTIFACT_DURATION_S: ${S2E_MOCK_ARTIFACT_DURATION_S:-10.0}
  S2E_MOCK_ARTIFACT_SAVE_PERIOD_S: ${S2E_MOCK_ARTIFACT_SAVE_PERIOD_S:-0.1}
  S2E_MOCK_DEBUG_VISUALIZER_PERIOD_S: ${S2E_MOCK_DEBUG_VISUALIZER_PERIOD_S:-0.2}

x-host-ros: &host-ros
  network_mode: host
  ipc: host

services:
  ros-base:
    image: s2e-ros-base:latest
    build:
      context: .
      dockerfile: docker/ros-base.Dockerfile
    profiles: ["build_only"]

  dev-mock:
    image: s2e-dev-mock:latest
    build:
      context: .
      dockerfile: docker/dev-mock.Dockerfile
    profiles: ["single_pc_mock"]
    <<: *host-ros
    environment:
      <<: [*ros-env, *mock-runtime-env]
      S2E_TEST_ARTIFACT_DIR: ${S2E_TEST_ARTIFACT_DIR:-/artifacts/visualizer}
      S2E_RUNTIME_ROLE: single_pc_mock
    volumes:
      - ${S2E_ARTIFACT_DIR:-./artifacts}:/artifacts

  robot-core:
    image: s2e-robot:latest
    build:
      context: .
      dockerfile: docker/robot.Dockerfile
    profiles: ["single_pc_split", "robot_side"]
    <<: *host-ros
    environment:
      <<: [*ros-env, *mock-runtime-env]
      S2E_TEST_ARTIFACT_DIR: ${S2E_TEST_ARTIFACT_DIR:-/artifacts/visualizer}
      S2E_RUNTIME_ROLE: robot_side
    volumes:
      - ${S2E_ARTIFACT_DIR:-./artifacts}:/artifacts

  gpu-inference-base:
    image: s2e-gpu-inference-base:latest
    build:
      context: .
      dockerfile: docker/gpu-inference-base.Dockerfile
    profiles: ["build_only"]

  onnx-runtime-base:
    image: s2e-onnx-runtime-base:latest
    build:
      context: .
      dockerfile: docker/onnx-runtime-base.Dockerfile
    profiles: ["build_only"]

  vlm:
    image: s2e-vlm:latest
    build:
      context: .
      dockerfile: docker/vlm.Dockerfile
    profiles: ["single_pc_split", "external_gpu", "vlm_only"]
    <<: *host-ros
    environment:
      <<: [*ros-env, *mock-runtime-env]
      S2E_RUNTIME_ROLE: external_pc_vlm
      VLM_BACKEND: ${VLM_BACKEND:-mock}
      VLM_API_URL: ${VLM_API_URL:-http://100.96.60.15:8000/v1/chat/completions}
      VLM_API_TIMEOUT_S: ${VLM_API_TIMEOUT_S:-10.0}
      VLM_API_MAX_RETRIES: ${VLM_API_MAX_RETRIES:-1}

  e2e:
    image: s2e-e2e:latest
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
    profiles: ["single_pc_split", "external_gpu", "e2e_only"]
    <<: *host-ros
    environment:
      <<: [*ros-env, *mock-runtime-env]
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      S2E_RUNTIME_ROLE: external_pc_e2e
      E2E_BACKEND: ${E2E_BACKEND:-mock}
      E2E_MODEL_PATH: ${E2E_MODEL_PATH:-/models/s2e/S2E}
    volumes:
      - ${S2E_NAV_MODEL_ZOO_DIR:-./nav_model_zoo}:/models/s2e:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
